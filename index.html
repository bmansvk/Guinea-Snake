<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GBELIK - Morča Adventures</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        #introScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
        }

        #introScreen h1 {
            font-size: 3em;
            color: #764ba2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        #introScreen .guinea-pig {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        #introScreen p {
            font-size: 1.2em;
            color: #333;
            margin: 15px 0;
            line-height: 1.6;
        }

        #introScreen button, #gameOverScreen button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        #introScreen button:hover, #gameOverScreen button:hover {
            transform: scale(1.1);
        }

        canvas {
            background: #f0f0f0;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: block;
            width: 100%;
            max-width: 800px;
        }

        #stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        #stats div {
            font-size: 1.2em;
            font-weight: bold;
            color: #764ba2;
            margin: 5px;
        }

        #bossBar {
            display: none;
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #bossBar .bar-container {
            background: #ddd;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        #bossBar .bar-fill {
            background: linear-gradient(90deg, #ff6b6b, #ee5a6f);
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        #controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            gap: 10px;
            z-index: 100;
        }

        #controls.mobile {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #764ba2;
            border-radius: 15px;
            font-size: 2em;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }

        .control-btn:active {
            background: #764ba2;
            color: white;
            transform: scale(0.95);
        }

        #upBtn { grid-column: 2; grid-row: 1; }
        #leftBtn { grid-column: 1; grid-row: 2; }
        #downBtn { grid-column: 2; grid-row: 2; }
        #rightBtn { grid-column: 3; grid-row: 2; }

        @media (max-width: 600px) {
            #gameContainer {
                padding: 10px;
            }
            #introScreen, #gameOverScreen {
                padding: 20px;
            }
            #introScreen h1 {
                font-size: 2em;
            }
            #stats div {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="introScreen">
            <h1>🐹 GBELIK 🐹</h1>
            <div class="guinea-pig">🐹</div>
            <p><strong>Vitaj v dobrodružstve morčaťa GBELIK!</strong></p>
            <p>🥕 Zober zeleninu a zväčšuj sa!</p>
            <p>💣 Vyhni sa bombám!</p>
            <p>🍅 Poraz rajčinového šéfa!</p>
            <p><strong>Level 1:</strong> Zozbieraj 10 zelenín</p>
            <p><strong>Level 2:</strong> Pozor na bomby!</p>
            <p><strong>Level 3:</strong> Boss fight!</p>
            <button onclick="startGame()">ZAČAŤ HRU</button>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h1 id="gameOverTitle">Koniec hry!</h1>
            <div id="gameOverEmoji" style="font-size: 4em; margin: 20px 0;">😢</div>
            <p id="gameOverMessage"></p>
            <button onclick="location.reload()">HRAŤ ZNOVA</button>
        </div>

        <div id="stats">
            <div>🥕 Zelenina: <span id="score">0</span></div>
            <div>📊 Level: <span id="level">1</span></div>
            <div>⚡ Rýchlosť: <span id="speed">1</span></div>
        </div>

        <div id="bossBar">
            <div style="text-align: center; margin-bottom: 5px; font-weight: bold; color: #ff6b6b;">
                🍅 ŠÉF RAJČINA 🍅
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="bossHealth" style="width: 100%;">
                    HP: 3/3
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="controls">
            <button class="control-btn" id="upBtn">↑</button>
            <button class="control-btn" id="leftBtn">←</button>
            <button class="control-btn" id="downBtn">↓</button>
            <button class="control-btn" id="rightBtn">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        const setCanvasSize = () => {
            const maxWidth = 800;
            const maxHeight = 600;
            const containerWidth = document.getElementById('gameContainer').clientWidth - 40;

            if (window.innerWidth <= 600) {
                canvas.width = Math.min(containerWidth, 400);
                canvas.height = Math.min(containerWidth, 400);
            } else {
                canvas.width = Math.min(containerWidth, maxWidth);
                canvas.height = Math.min(containerWidth * 0.75, maxHeight);
            }
        };

        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // Detect mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        if (isMobile) {
            document.getElementById('controls').classList.add('mobile');
        }

        // Game variables
        let gameRunning = false;
        let gridSize = 20;
        let tileCount;
        let guineaPig = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = {};
        let bombs = [];
        let score = 0;
        let level = 1;
        let speed = 1;
        let gameSpeed = 150;
        let boss = null;
        let bossHealth = 3;
        let bossShootTimer = 0;

        // Guinea pig colors (brown-black-mustard)
        const guineaPigColors = ['#8B4513', '#3d2817', '#DAA520'];

        // Vegetable emojis
        const vegetables = ['🥕', '🥬', '🥦', '🌽', '🫑', '🥒'];

        function startGame() {
            document.getElementById('introScreen').style.display = 'none';
            gameRunning = true;
            initGame();
            gameLoop();
        }

        function initGame() {
            tileCount = Math.floor(canvas.width / gridSize);
            guineaPig = [
                { x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            level = 1;
            speed = 1;
            gameSpeed = 150;
            bombs = [];
            boss = null;
            bossHealth = 3;
            document.getElementById('bossBar').style.display = 'none';
            spawnFood();
            updateStats();
        }

        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount),
                    emoji: vegetables[Math.floor(Math.random() * vegetables.length)]
                };
                validPosition = !guineaPig.some(segment => segment.x === food.x && segment.y === food.y);
                if (boss && food.x === boss.x && food.y === boss.y) {
                    validPosition = false;
                }
            }
        }

        function spawnBomb() {
            let validPosition = false;
            let attempts = 0;
            while (!validPosition && attempts < 50) {
                const bomb = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                validPosition = !guineaPig.some(segment => segment.x === bomb.x && segment.y === bomb.y);
                validPosition = validPosition && (bomb.x !== food.x || bomb.y !== food.y);
                validPosition = validPosition && !bombs.some(b => b.x === bomb.x && b.y === bomb.y);
                if (boss) {
                    validPosition = validPosition && (bomb.x !== boss.x || bomb.y !== boss.y);
                }
                if (validPosition) {
                    bombs.push(bomb);
                }
                attempts++;
            }
        }

        function spawnBoss() {
            boss = {
                x: Math.floor(tileCount / 2),
                y: 3
            };
            bossHealth = 3;
            document.getElementById('bossBar').style.display = 'block';
            updateBossBar();
        }

        function updateBossBar() {
            const percentage = (bossHealth / 3) * 100;
            document.getElementById('bossHealth').style.width = percentage + '%';
            document.getElementById('bossHealth').textContent = `HP: ${bossHealth}/3`;
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('speed').textContent = speed;
        }

        function gameLoop() {
            if (!gameRunning) return;

            direction = { ...nextDirection };

            const head = { ...guineaPig[0] };
            head.x += direction.x;
            head.y += direction.y;

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver('Narazil si do steny!');
                return;
            }

            // Self collision
            if (guineaPig.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver('Uhryzoł si sa!');
                return;
            }

            // Bomb collision
            if (bombs.some(bomb => bomb.x === head.x && bomb.y === head.y)) {
                gameOver('Trafila ťa bomba! Hra sa začína od začiatku!');
                setTimeout(() => {
                    location.reload();
                }, 2000);
                return;
            }

            guineaPig.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                speed++;
                gameSpeed = Math.max(50, 150 - (speed * 5));
                updateStats();
                spawnFood();

                // Level progression
                if (level === 1 && score >= 10) {
                    level = 2;
                    updateStats();
                    // Add bombs in level 2
                    for (let i = 0; i < 3; i++) {
                        spawnBomb();
                    }
                } else if (level === 2 && score >= 20) {
                    level = 3;
                    updateStats();
                    spawnBoss();
                    bombs = []; // Clear bombs for boss fight
                }
            } else {
                guineaPig.pop();
            }

            // Boss collision (attacking)
            if (boss && head.x === boss.x && head.y === boss.y) {
                bossHealth--;
                updateBossBar();

                if (bossHealth <= 0) {
                    winGame();
                    return;
                } else {
                    // Move boss to new position
                    let validPosition = false;
                    while (!validPosition) {
                        boss.x = Math.floor(Math.random() * tileCount);
                        boss.y = Math.floor(Math.random() * (tileCount / 2));
                        validPosition = !guineaPig.some(segment => segment.x === boss.x && segment.y === boss.y);
                        validPosition = validPosition && (boss.x !== food.x || boss.y !== food.y);
                    }
                }
            }

            // Boss shoots bombs
            if (boss) {
                bossShootTimer++;
                if (bossShootTimer >= 8) {
                    bossShootTimer = 0;
                    spawnBomb();
                }
            }

            // Level 2: spawn bombs periodically
            if (level === 2 && Math.random() < 0.05) {
                spawnBomb();
            }

            draw();
            setTimeout(gameLoop, gameSpeed);
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#e8f5e8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#d0d0d0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw guinea pig GBELIK
            guineaPig.forEach((segment, index) => {
                const colorIndex = index % guineaPigColors.length;
                ctx.fillStyle = guineaPigColors[colorIndex];
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);

                // Draw eyes on head
                if (index === 0) {
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(segment.x * gridSize + 8, segment.y * gridSize + 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(segment.x * gridSize + 14, segment.y * gridSize + 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw food
            ctx.font = `${gridSize - 4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.emoji, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);

            // Draw bombs
            bombs.forEach(bomb => {
                ctx.fillText('💣', bomb.x * gridSize + gridSize / 2, bomb.y * gridSize + gridSize / 2);
            });

            // Draw boss
            if (boss) {
                ctx.font = `${gridSize * 2}px Arial`;
                ctx.fillText('🍅', boss.x * gridSize + gridSize / 2, boss.y * gridSize + gridSize / 2);
            }
        }

        function gameOver(message) {
            gameRunning = false;
            document.getElementById('gameOverTitle').textContent = 'Koniec hry!';
            document.getElementById('gameOverEmoji').textContent = '😢';
            document.getElementById('gameOverMessage').textContent = message + ` Zozberal si ${score} zelenín!`;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        function winGame() {
            gameRunning = false;
            document.getElementById('gameOverTitle').textContent = 'VÝHRA!';
            document.getElementById('gameOverEmoji').textContent = '🎉';
            document.getElementById('gameOverMessage').textContent = `Gratulujeme! Porazil si šéfa rajčinu! Zozberal si ${score} zelenín!`;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });

        // Touch controls
        document.getElementById('upBtn').addEventListener('click', () => {
            if (direction.y === 0) nextDirection = { x: 0, y: -1 };
        });
        document.getElementById('downBtn').addEventListener('click', () => {
            if (direction.y === 0) nextDirection = { x: 0, y: 1 };
        });
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (direction.x === 0) nextDirection = { x: -1, y: 0 };
        });
        document.getElementById('rightBtn').addEventListener('click', () => {
            if (direction.x === 0) nextDirection = { x: 1, y: 0 };
        });

        // Prevent default touch behavior
        document.getElementById('controls').addEventListener('touchstart', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
